services:
  postgres:
    image: postgres:16-alpine
    container_name: hypatia-v2-postgres
    environment:
      POSTGRES_DB: hypatia
      POSTGRES_USER: hypatia
      POSTGRES_PASSWORD: hypatia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypatia -d hypatia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hypatia_v2_postgres:/var/lib/postgresql/data

volumes:
  hypatia_v2_postgres:
